<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mi tienda de dulces</title>
    <link rel="stylesheet" href="tiendaStyle.css">
</head>
<body>
    <header>
        <p class="logo-text">🍩</p>
        <div class="logo">Mi Negocio</div>
        
        <a href="carrito.html" class="cart-icon">
    🛒 <span id="cart-count">0</span>
        </a>
        
    </header>

    <main>
        <section class="banner">
            <h2>Mi negocio</h2>
            <p>Información General</p>
        </section>

        <section class="productos">
            <h2>Más vendidos</h2>
            <div class="grid-tarjetas">
                
                <!-- Tarjeta 1 -->       
                <article class="tarjeta" data-id="1" data-name="dona-glaseada" data-price="35">
                    <img src="img/dona.jpg" alt="Dona glaseada">
                    <h3>Dona glaseada</h3>
                    <p class="precio">$35</p>
                    <button class="btn-agregar">+ Agregar</button>
                </article>

                <article class="tarjeta" data-id="2" data-name="dona-chocolate" data-price="50">
                    <img src="img/dona.jpg" alt="Dona glaseada">
                    <h3>Dona de Chocolate</h3>
                    <p class="precio">$50</p>
                    <button class="btn-agregar">+ Agregar</button>
                </article>
                
            </div>
        </section>
    </main>

    <footer>
        <p>Desarrollador: +53 59638868</p>
    </footer>
    
<script src="carrito.js"></script>
</body>
</html>
